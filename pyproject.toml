[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timsim"
version = "0.1.0"
description = "A person-in-the-loop layer and a larger virtual population for the UVA/Padova simulator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "simglucose>=0.2.2",
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
timsim-build-population = "timsim.population.build:main"

[tool.setuptools.packages.find]
include = ["timsim*"]

[tool.setuptools.package-data]
"timsim.population" = ["params/*.csv", "params/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
