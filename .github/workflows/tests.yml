name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools<81"
          pip install -e ".[dev]"
      - name: Build a small population
        # The full 100 takes a few minutes; CI checks the generator works and the
        # subjects it produces are consistent, not the shipped population itself.
        run: python -m simperson.population.build --n 9 --quiet
      - name: Test
        run: pytest -q
